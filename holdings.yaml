# Your portfolio — the ONE file you maintain by hand.
#
# Everything else (CORE vs SPECULATIVE tier, theme mapping, 7% stop tracking, and
# cash-deployment suggestions) is DERIVED automatically by the system, recomputed
# fresh at dashboard load and after each close. You never edit those.
#
# After a trade, just update the weights below. That's it.
#
# ─────────────────────────────────────────────────────────────────────────────
# portfolio  — context the system uses to turn % weights into dollar amounts
#   total_value             approximate total portfolio value ($)
#   bi_weekly_contribution  new cash added every two weeks ($) — sizes suggestions
#
# positions  — one line per holding, just the % weight. CASH is money-market dry
#              powder available to deploy.
#
# overrides  — only when the auto-classifier would be WRONG. "core" forces a name
#              to be held-through-volatility (no 7% stop); "speculative" forces the
#              stop discipline. The override always wins over the evidence rules.
# ─────────────────────────────────────────────────────────────────────────────

portfolio:
  total_value: 1300000
  bi_weekly_contribution: 1600

positions:
  NVDA: 11
  MSFT: 11
  AMZN: 11
  ELF:  10
  SOFI: 8
  PLTR: 7
  TSLA: 7
  META: 7
  AVGO: 7
  TSM:  5
  CASH: 16

overrides:
  TSLA: core      # long-term Physical-AI bull — hold through volatility, no stop
